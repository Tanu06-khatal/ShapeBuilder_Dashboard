<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login | Shape Builder</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: radial-gradient(circle at center, #1e2230 0%, #12141c 100%);
        }
        .login-card {
            background: rgba(30, 34, 48, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-logo {
            font-size: 3rem;
            color: var(--color-accent);
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--color-accent-glow);
        }
        .login-card h2 {
            justify-content: center;
            color: var(--text-primary);
            margin-bottom: 5px;
            font-size: 1.5rem;
        }
        .login-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            transition: var(--transition);
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 10px var(--color-accent-glow);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            justify-content: center;
            margin-top: 10px;
        }
        .error-msg {
            color: var(--color-wrong);
            font-size: 0.85rem;
            margin-top: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body class="dark-theme">

    <div class="login-card">
        <div class="login-logo">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2>Faculty Portal</h2>
        <p>Smart Student Performance Tracking</p>
        
        <form id="login-form">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Username" required autocomplete="off">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-login">Login <i class="fa-solid fa-arrow-right"></i></button>
            <div class="error-msg" id="error-msg"></div>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            if (user === 'faculty' && pass === '1234') {
                errorMsg.style.color = '#10b981';
                errorMsg.innerText = 'Login successful! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            } else {
                errorMsg.style.color = '#ef4444';
                errorMsg.innerText = 'Invalid username or password.';
            }
        });
    </script>
</body>
</html>
